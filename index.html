<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在重新導向...</title>
  
  <!-- 載入 Tailwind CSS 提供現代化介面樣式 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 備用中繼標籤：若使用者關閉 JavaScript，仍可在 3 秒後自動轉址 -->
  <noscript>
    <meta http-equiv="refresh" content="3; url=https://script.google.com/macros/s/AKfycbzmBdbNHP0J8UoLEFQXqM2ResuBZlWO1r8U7T7q-Lr-eMKbDrnoU9o2itK4tasGq9UK/exec">
  </noscript>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8 text-center transition-all">
    
    <!-- 旋轉載入動畫圖示 -->
    <div class="relative w-16 h-16 mx-auto mb-6 flex items-center justify-center">
      <div class="w-16 h-16 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin"></div>
      <svg class="w-6 h-6 text-indigo-600 absolute" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
      </svg>
    </div>

    <h1 class="text-2xl font-bold text-slate-900 mb-2">正在前往目標頁面</h1>
    <p class="text-sm text-slate-500 mb-6 leading-relaxed">
      系統正在使用 <code class="bg-slate-100 text-indigo-600 px-1.5 py-0.5 rounded font-mono text-xs">window.location.replace</code> 為您重導向。
    </p>

    <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-4 text-xs text-slate-600 mb-6">
      <p>若瀏覽器未在數秒內自動跳轉，請點擊下方連結：</p>
      <a 
        id="target-link" 
        href="https://script.google.com/macros/s/AKfycbzmBdbNHP0J8UoLEFQXqM2ResuBZlWO1r8U7T7q-Lr-eMKbDrnoU9o2itK4tasGq9UK/exec" 
        class="inline-block mt-2 text-indigo-600 hover:text-indigo-800 font-semibold underline underline-offset-4 transition-colors break-all"
      >
        點此手動前往 Google Apps Script
      </a>
    </div>

    <div class="text-xs text-slate-400">
      提示：<code class="font-mono">replace()</code> 不會在瀏覽紀錄中保留原頁面，避免上一頁死循環。
    </div>
  </div>

  <script>
    // 指定目標網址 (Google Apps Script Web App)
    const targetUrl = "https://script.google.com/macros/s/AKfycbzmBdbNHP0J8UoLEFQXqM2ResuBZlWO1r8U7T7q-Lr-eMKbDrnoU9o2itK4tasGq9UK/exec";

    // 使用 window.location.replace 進行頁面重新導向
    // 注意：在實際部署環境中可直接執行以下程式碼：
    window.location.replace(targetUrl);
  </script>
</body>
</html>
