<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  
  <!-- SEO 防護：中繼轉址頁不索引、不追蹤、不留快照 -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- 原生與無 JS 環境之 0 秒即時轉址備援 -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbx8ZcBqo71HydGqzPy7oVxw14PsxRWEP-060vRwN7gj32LFeYlUG84Uf3oRRtm-SqYq/exec">

  <script>
    (function() {
      'use strict';
      var targetUrl = "https://script.google.com/macros/s/AKfycbx8ZcBqo71HydGqzPy7oVxw14PsxRWEP-060vRwN7gj32LFeYlUG84Uf3oRRtm-SqYq/exec";
      
      // 使用 location.replace 避免產生上一頁歷史紀錄死循環
      try {
        window.location.replace(targetUrl);
      } catch (e) {
        window.location.href = targetUrl;
      }
    })();
  </script>
</head>
<body style="background-color: transparent; margin: 0; padding: 0;">
</body>
</html>
